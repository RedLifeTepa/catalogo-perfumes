<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1e3a5f"><title>AuraERP · Catálogo</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="css/catalogo.css?v=1.7.14"></head><body>
<div class="public-shell"><header class="pub-header"><div class="brand-wrap"><img id="brandLogo" class="brand-logo" alt=""><div class="pub-brand" id="brandName">AuraERP</div></div><input id="search" class="pub-search" placeholder="Buscar productos..."><div class="header-actions"></span><button class="cart-btn" id="cartOpen">🛒 Carrito <span id="cartCount">0</span></button></div></header>
<section class="hero" id="hero"><button id="heroPrev" class="hero-arrow hero-prev">‹</button><div class="hero-copy"><div class="eyebrow" id="heroTag">Producto destacado</div><h1 id="heroName">Descubre nuestro catálogo</h1><p id="heroText">Productos seleccionados para ti.</p><div class="hero-actions"><button class="btn btn-light" id="heroView">Ver producto</button><button class="btn btn-gold" id="heroWA">Consultar</button></div><div id="heroDots" class="hero-dots"></div></div><img id="heroImg" alt=""><button id="heroNext" class="hero-arrow hero-next">›</button></section>
<main class="catalog"><div class="catalog-toolbar"><div id="chips" class="chips"><button class="chip active" data-cat="">▦ Todos</button></div><div class="sort-wrap"><label>Ordenar por:</label><select id="sortProducts"><option value="recent">Más recientes</option><option value="priceAsc">Precio menor</option><option value="priceDesc">Precio mayor</option><option value="name">Nombre</option></select></div></div><div class="catalog-meta"><strong>Catálogo</strong><span id="count">Cargando productos...</span></div><div id="products" class="products"></div></main>
<section class="benefits" id="benefits"></section>
<footer class="store-footer"><div id="copyright"></div><nav><a href="./preguntas.html">Preguntas frecuentes</a><a href="./terminos.html">Términos y condiciones</a><a href="./privacidad.html">Política de privacidad</a></nav><div class="socials" id="socials"></div></footer>
</div>
<div id="detailModal" class="modal"><div class="modal-card"><button id="closeDetail" class="modal-close">✕</button><div id="detail"></div></div></div>
<aside id="cartDrawer" class="cart-drawer"><div class="cart-head"><h2>Tu carrito</h2><button id="cartClose">✕</button></div><div id="cartItems" class="cart-items"></div><div class="cart-total"><span>Total</span><strong id="cartTotal">$0.00</strong></div><button id="checkoutBtn" class="btn btn-gold wide">ORDENAR</button></aside>
<div id="checkoutModal" class="modal"><div class="modal-card checkout-card"><button id="closeCheckout" class="modal-close">✕</button><h2>Finalizar pedido</h2><p class="muted">Completa tus datos. Guardaremos tu pedido antes de abrir WhatsApp.</p><form id="checkoutForm"><div class="checkout-grid"><label>Nombre completo *<input name="nombre" required></label><label>Teléfono *<input name="telefono" required inputmode="tel"></label><label>Correo electrónico<input name="correo" type="email"></label></div><div id="checkoutSummary"></div><button class="btn btn-gold wide" id="submitOrder">Guardar pedido y continuar</button><div id="checkoutMsg" class="checkout-msg"></div></form></div></div>
<script type="module" src="js/catalogo.js?v=1.7.14"></script></body></html>
